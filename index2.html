
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Home Mama's Kutty</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Pacifico&display=swap');

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(270deg, #ff6ec4, #7873f5, #42e695, #f9ca24);
  background-size: 800% 800%;
  animation: gradientMove 12s ease infinite;
  font-family: 'Poppins', sans-serif;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.scene {
  perspective: 2000px;
}

.card {
  width: 400px;
  height: 500px;
  position: relative;
  transform-style: preserve-3d;
}

/* FRONT COVER */
.cover {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  transform-origin: left;
  transition: transform 1.2s ease;
  z-index: 2;
}

/* INSIDE */
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #a18cd1, #fbc2eb, #f9f586);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  overflow: hidden;
}

/* OPEN EFFECT */
.scene:hover .cover {
  transform: rotateY(-180deg);
}



.cover {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
}

.inside {
  background: linear-gradient(135deg, #a18cd1, #fbc2eb, #f9f586);
}

.cover h1 {
  font-family: 'Pacifico', cursive;
  font-size: 32px;
}

.cover p {
  font-size: 18px;
}

.inside h2 {
  font-family: 'Pacifico', cursive;
  color: #ff4081;
  font-size: 30px;
  margin-bottom: 15px;
}

.message {
  font-size: 17px;
  color: #333;
  line-height: 1.6;
  max-width: 90%;
}

/* BABY FOOTSTEPS BORDER */
.footsteps-border {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.footsteps-border span {
  position: absolute;
  font-size: 18px;
  opacity: 0.8;
}

/* TOP (left → right) */
.top-track span {
  top: 5px;
  animation: moveRight 6s linear infinite;
}

/* RIGHT (top → bottom) */
.right-track span {
  right: 5px;
  animation: moveDown 6s linear infinite;
}

/* BOTTOM (right → left) */
.bottom-track span {
  bottom: 5px;
  animation: moveLeft 6s linear infinite;
}

/* LEFT (bottom → top) */
.left-track span {
  left: 5px;
  animation: moveUp 6s linear infinite;
}

@keyframes moveRight {
  0% { left: -10%; }
  100% { left: 110%; }
}

@keyframes moveLeft {
  0% { right: -10%; }
  100% { right: 110%; }
}

@keyframes moveDown {
  0% { top: -10%; }
  100% { top: 110%; }
}

@keyframes moveUp {
  0% { bottom: -10%; }
  100% { bottom: 110%; }
}
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { left: 110%; opacity: 0; }
}

/* CONFETTI */
.confetti span {
  position: absolute;
  width: 10px;
  height: 10px;
  animation: fall 5s linear infinite;
}

.confetti span:nth-child(1){ left:10%; background:#ff6ec4; animation-delay:0s }
.confetti span:nth-child(2){ left:30%; background:#42e695; animation-delay:1s }
.confetti span:nth-child(3){ left:50%; background:#f9ca24; animation-delay:2s }
.confetti span:nth-child(4){ left:70%; background:#7873f5; animation-delay:3s }
.confetti span:nth-child(5){ left:90%; background:#ff9a9e; animation-delay:4s }

@keyframes fall {
  0% { transform: translateY(-100px); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(500px); opacity: 0; }
}

/* FLOATING ICONS */
.icons span {
  position: absolute;
  bottom: -50px;
  font-size: 22px;
  animation: float 6s infinite ease-in;
}

.icons span:nth-child(1){ left:15%; animation-delay:0s }
.icons span:nth-child(2){ left:35%; animation-delay:1s }
.icons span:nth-child(3){ left:55%; animation-delay:2s }
.icons span:nth-child(4){ left:75%; animation-delay:3s }
.icons span:nth-child(5){ left:90%; animation-delay:4s }

@keyframes float {
  0% { transform: translateY(0); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-400px); opacity: 0; }
}

.music { display:none; }

</style>
</head>

<body>

<div class="scene">
  <div class="card" onclick="playMusic()">

    <!-- INSIDE -->
    <div class="inside">
      <h2>Naa Sunami 🌊 → Nenu ekku pettina Baanam 🏹 → Naa Alludu...❤️ 👶💖</h2>
      <p class="message">
        A little bundle of joy has arrived —<br>
        tiny hands, tiny feet, a precious little soul 💕,<br>
        filling hearts with love and smiles! ✨
      </p>

      <!-- FOOTSTEPS BORDER -->
      <div class="footsteps-border">
        <div class="top-track">
          <span>👣</span><span style="animation-delay:1s">👣</span><span style="animation-delay:2s">👣</span>
        </div>
        <div class="right-track">
          <span>👣</span><span style="animation-delay:1s">👣</span><span style="animation-delay:2s">👣</span>
        </div>
        <div class="bottom-track">
          <span>👣</span><span style="animation-delay:1s">👣</span><span style="animation-delay:2s">👣</span>
        </div>
        <div class="left-track">
          <span>👣</span><span style="animation-delay:1s">👣</span><span style="animation-delay:2s">👣</span>
        </div>
      </div>

      <div class="icons">
        <span>💖</span>
        <span>✨</span>
        <span>🎈</span>
        <span>🌸</span>
        <span>🍼</span>
      </div>
    </div>

    <!-- FRONT COVER -->
    <div class="cover">
      <div class="confetti">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1>Welcome Home 💖</h1>
      
    </div>

  </div>
</div>

<audio id="bgMusic" class="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){
  const music = document.getElementById('bgMusic');
  music.play();
}
</script>

</body>
</html>
